<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>TamStick - Sticker Showcase</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="plugins/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="plugins/themify-icons/themify-icons.css">
  <link rel="stylesheet" href="plugins/slick/slick.css">
  <link rel="stylesheet" href="plugins/Venobox/venobox.css">
  <link rel="stylesheet" href="plugins/aos/aos.css">
  <link href="css/style.css" rel="stylesheet">
  <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
</head>

<body>
  <section class="fixed-top navigation">
    <div class="container">
      <nav class="navbar navbar-expand-lg navbar-light">
        <a class="navbar-brand" href="index.html">
          <img src="images/tamstickwithtext.png" alt="TamStick">
        </a>
        <button class="navbar-toggler border-0" type="button" data-toggle="collapse" data-target="#navbar"
          aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse text-center" id="navbar">
          <ul class="navbar-nav ml-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item active"><a class="nav-link" href="stickers.html">Stickers</a></li>
          </ul>
          <a href="index.html#getit" class="btn btn-primary ml-lg-3">Download</a>
        </div>
      </nav>
    </div>
  </section>

  <main class="section product" style="background-image: url(images/backgrounds/about-bg.png);">
    <div class="container">
      <div class="row">
        <div class="col-12 text-center">
          <h1 class="section-title">Sticker Showcase</h1>
          <p class="mb-100">A collection of fun, expressive stickers for every conversation.</p>
        </div>
      </div>
      <div id="sticker-sections" aria-live="polite"></div>
    </div>
  </main>

  <footer class="footer-section footer" style="background-image: url(images/backgrounds/footer-bg.png);">
    <div class="container">
      <div class="row">
        <div class="col-lg-4 text-center text-lg-left mb-4 mb-lg-0">
          <a href="index.html"><img class="img-fluid" src="images/tamstickwithtext.png" alt="TamStick"></a>
        </div>
        <nav class="col-lg-8 align-self-center mb-5">
          <ul class="list-inline text-lg-right text-center footer-menu">
            <li class="list-inline-item"><a href="index.html">Home</a></li>
            <li class="list-inline-item"><a href="about.html">About</a></li>
            <li class="list-inline-item active"><a href="stickers.html">Stickers</a></li>
            <li class="list-inline-item"><a href="privacy.html">Privacy &amp; Policy</a></li>
            <li class="list-inline-item"><a href="terms.html">Terms &amp; Conditions</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </footer>

  <script src="plugins/jQuery/jquery.min.js"></script>
  <script src="plugins/bootstrap/bootstrap.min.js"></script>
  <script>
    const sections = document.getElementById('sticker-sections');

    function createCard(sticker) {
      const card = document.createElement('article');
      card.className = 'sticker-card';
      card.innerHTML = `
        <img src="${sticker.image}" alt="${sticker.title}" loading="lazy">
        <h4>${sticker.title}</h4>
        <p>${sticker.description}</p>
      `;
      return card;
    }

    function renderSections(categories) {
      categories.forEach(category => {
        const section = document.createElement('section');
        section.className = 'sticker-section';
        section.innerHTML = `<h2 class="sticker-section-title">${category.title}</h2>`;

        const gallery = document.createElement('div');
        gallery.className = 'sticker-gallery';
        category.stickers.forEach(sticker => gallery.appendChild(createCard(sticker)));
        section.appendChild(gallery);
        sections.appendChild(section);
      });
    }

    fetch('stickers.json')
      .then(response => {
        if (!response.ok) {
          throw new Error(`Unable to load stickers (${response.status})`);
        }
        return response.json();
      })
      .then(data => renderSections(data.categories))
      .catch(error => {
        sections.innerHTML = '<p class="text-center">Stickers could not be loaded right now.</p>';
        console.error(error);
      });
  </script>
</body>
</html>
